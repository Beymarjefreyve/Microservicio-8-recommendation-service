spring.config.import=optional:file:.env[.properties]
spring.application.name=recommendation-service
server.port=${SERVER_PORT:8009}

# DataSource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Feign
spring.cloud.openfeign.client.config.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:8002}
spring.cloud.openfeign.client.config.catalog-service.connect-timeout=10000
spring.cloud.openfeign.client.config.catalog-service.read-timeout=35000
spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=35000

# Error details
server.error.include-message=always
logging.level.com.microshop=INFO

# Google Gemini AI
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:512}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:8000}
gemini.rate-limit-rpm=${GEMINI_RATE_LIMIT_RPM:10}
